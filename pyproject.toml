[project]
name = "rqark-tui"
version = "0.9.8"
description = "Terminal chat client for LLM coding agents, built on Textual"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RedQueenArk" }]
keywords = ["llm", "tui", "textual", "chat", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Terminals",
]

dependencies = [
    "textual>=8.2.8",
    "wcwidth>=0.8.3",
    "rqark-app==0.11.8",
    "rqark-core==0.5.0",
]

[project.scripts]
rqark-tui = "rqark_tui.app:main"

[project.urls]
Homepage = "https://github.com/Red-Queen-Ark/rqark-tui"
Repository = "https://github.com/Red-Queen-Ark/rqark-tui"
Issues = "https://github.com/Red-Queen-Ark/rqark-tui/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rqark_tui"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
    "ty>=0.0.38",
]

[tool.ruff]
exclude = ["*.ipynb"]
line-length = 240
indent-width = 4
target-version = "py314"

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ty.src]
exclude = ["tests/"]

[tool.ty.environment]
python-platform = "all"

[tool.pyright]
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = []
filterwarnings = ["default"]
